<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#fbfcfd;
  --border:#e9ebf0; --border-2:#eef0f4;
  --ink:#0f1729; --ink-2:#5b6573; --ink-3:#98a1b0;
  --brand:#3056c9; --brand-tint:#eef2fe;
  --green:#179f6b; --green-tint:#e7f6ef;
  --red:#e0444b; --red-tint:#fdecec;
  --amber:#c98a16; --amber-tint:#fbf2df;
  --blue:#3060ea; --blue-tint:#eef2fe;
  --shadow:0 1px 2px rgba(16,23,41,.04), 0 1px 3px rgba(16,23,41,.06);
  --shadow-lg:0 12px 32px rgba(16,23,41,.12);
  --r:14px;
}
:root[data-theme="dark"]{
  --bg:#0f1420; --surface:#171d2b; --surface-2:#1d2536;
  --border:#2a3344; --border-2:#222a3b;
  --ink:#e9edf4; --ink-2:#a3adbe; --ink-3:#6b768a;
  --brand:#5d7df2; --brand-tint:#1b2540;
  --green:#27b083; --green-tint:#14271e;
  --red:#f0696e; --red-tint:#2c1a1c;
  --amber:#e0a93a; --amber-tint:#292414;
  --blue:#5b8def; --blue-tint:#172139;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 12px 36px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 48px}

.top{position:sticky;top:0;z-index:20;background:#000;color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
.logo{font-weight:800;letter-spacing:.14em;font-size:15px;white-space:nowrap}
.logo .g{color:#d8a52e}
.sep{width:1px;height:20px;background:#333}
.ttl{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.flag-co{display:inline-block;width:20px;height:14px;border-radius:2px;background:linear-gradient(#fcd116 0 50%,#003893 50% 75%,#ce1126 75%)}
.sp{flex:1}
.upd{font-size:12px;color:#9aa3b2;white-space:nowrap}
.quien{font-size:12.5px;color:#d8a52e;font-weight:700;white-space:nowrap}
.ib{background:#1b1b1b;border:1px solid #333;color:#fff;border-radius:10px;height:34px;min-width:34px;padding:0 10px;font-size:13px}
.ib:hover{background:#262626}

.nav{display:flex;gap:6px;overflow-x:auto;margin:18px 0 14px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:12px;padding:9px 14px;font-size:13.5px;font-weight:700;white-space:nowrap;box-shadow:var(--shadow)}
.nav button .n{display:inline-block;min-width:22px;padding:1px 7px;margin-left:7px;border-radius:999px;background:var(--border-2);color:var(--ink-2);font-size:12px}
.nav button .n.hot{background:var(--red);color:#fff}
.nav button.act{background:var(--ink);border-color:var(--ink);color:var(--surface)}
:root[data-theme="dark"] .nav button.act{background:var(--brand);border-color:var(--brand);color:#fff}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;color:var(--ink-2);font-size:13px;font-weight:600;padding:7px 11px;border-radius:8px}
.seg button.act{background:var(--ink);color:var(--surface)}
:root[data-theme="dark"] .seg button.act{background:var(--brand);color:#fff}
select,input[type=search],input[type=date],input[type=password],textarea{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:10px;height:36px;padding:0 10px;box-shadow:var(--shadow)}
input[type=search]{min-width:200px;flex:1;max-width:320px}
textarea{height:auto;min-height:70px;padding:9px 10px;width:100%;resize:vertical}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12px;color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.v.green{color:var(--green)} .v.red{color:var(--red)} .v.blue{color:var(--blue)} .v.amber{color:var(--amber)}

h3.sec{font-size:14px;margin:18px 0 8px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.aviso{background:var(--brand-tint);color:var(--brand);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:11px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border-2);vertical-align:top}
tbody tr.cl{cursor:pointer}
tbody tr.cl:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;background:var(--surface-2)}
.muted{color:var(--ink-3);font-size:12px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;margin:1px 0}
.c-gray{background:var(--border-2);color:var(--ink-2)}
.c-blue{background:var(--blue-tint);color:var(--blue)}
.c-green{background:var(--green-tint);color:var(--green)}
.c-red{background:var(--red-tint);color:var(--red)}
.c-amber{background:var(--amber-tint);color:var(--amber)}
.btn{border:0;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700}
.b-green{background:var(--green);color:#fff}
.b-red{background:var(--red);color:#fff}
.b-amber{background:var(--amber);color:#fff}
.b-gray{background:var(--border-2);color:var(--ink)}
.b-blue{background:var(--brand);color:#fff}
.b-wa{background:#25D366;color:#fff}
a.btn{text-decoration:none;display:inline-block}
.acc{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty > b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty p{max-width:520px;margin:0 auto;font-size:13.5px;line-height:1.5}
.err{background:var(--red-tint);color:var(--red);border-radius:12px;padding:10px 14px;font-size:13px;margin:12px 0;display:none}

.ov{position:fixed;inset:0;background:rgba(10,14,24,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:90vh;overflow:auto}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.mh b{flex:1;font-size:16px}
.mx{border:0;background:var(--border-2);color:var(--ink);width:32px;height:32px;border-radius:9px;font-size:16px}
.mb{padding:6px 18px 18px}
.fila{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border-2);font-size:13.5px}
.fila .k{width:130px;flex-shrink:0;color:var(--ink-2)}
.fila .val{flex:1;word-break:break-word}
.hist{margin-top:12px;border-left:3px solid var(--border);padding-left:12px}
.hist div{font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--border-2)}

.login{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.login.on{display:flex}
.login .box{background:#111;border:1px solid #2a2a2a;border-radius:18px;padding:28px 24px;width:100%;max-width:340px;text-align:center;color:#fff}
.login input{width:100%;height:48px;font-size:22px;letter-spacing:.4em;text-align:center;margin:18px 0 12px;background:#1b1b1b;color:#fff;border-color:#333}
.login .btn{width:100%;padding:13px}
.login .e{color:#f0696e;font-size:13px;min-height:18px}

@media (max-width:900px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:720px){
  .upd{display:none}
  .ttl .t2{display:none}
  table.resp thead{display:none}
  table.resp,table.resp tbody,table.resp tr,table.resp td{display:block;width:100%}
  table.resp tbody tr{padding:12px 14px;border-bottom:1px solid var(--border-2)}
  table.resp td{border:0;padding:2px 0}
  table.resp td.hide-m{display:none}
  table.resp td.num{text-align:left}
  input[type=search]{max-width:none;min-width:0;flex:1 1 100%}
}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="box">
    <div class="logo" style="font-size:17px">JAYE <span class="g">GROUP</span></div>
    <div style="margin-top:8px;color:#9aa3b2;font-size:13px"><span class="flag-co"></span> Equipo Colombia</div>
    <input type="password" id="pin" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="PIN">
    <div class="e" id="pinErr"></div>
    <button class="btn b-blue" id="btnPin">Entrar</button>
  </div>
</div>

<div class="top">
  <div class="wrap">
    <div class="logo">JAYE <span class="g">GROUP</span></div>
    <div class="sep"></div>
    <div class="ttl"><span class="flag-co"></span>Equipo Colombia</div>
    <div class="sp"></div>
    <div class="quien" id="quien"></div>
    <div class="upd" id="upd"></div>
    <button class="ib" id="btnRef" title="Actualizar">↻</button>
    <button class="ib" id="btnTema" title="Modo claro / oscuro">◐</button>
    <button class="ib" id="btnSalir" title="Salir">Salir</button>
  </div>
</div>

<div class="wrap">
  <div class="nav" id="nav"></div>
  <div class="err" id="err"></div>
  <div id="vista"></div>
</div>

<div class="ov" id="ov">
  <div class="modal">
    <div class="mh"><b id="mt">Pedido</b><button class="mx" id="mx">✕</button></div>
    <div class="mb" id="mb"></div>
  </div>
</div>

<script>
/* ============================================================
   EQUIPO COLOMBIA (30-09) — página de trabajo de las dos personas:
   · Operador: llama a los clientes que confirmaron (o piden cambios), a los
     que están en reparto y a los que tienen novedad, y deja el resultado.
   · Auditor: ve todo lo del operador, tiempos y resultados, y deja observaciones.
   Todo lo que marcan sale al instante en la aprobación del panel de James.
   Aquí NO se aprueba ni se monta nada en Dropi: eso lo decide James.
   Datos: n8n /co-operacion (pide PIN) · guardar: /co-llamada
   ============================================================ */
const BASE = 'https://n8n-production-8a42.up.railway.app/webhook';
const TZ = 'America/Bogota';
let PIN = '', YO = null, DATA = null, vista = 'llamar', periodo = 'mes', desde = '', hasta = '', qBuscar = '', audQuien = '';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cop = n => '$' + Math.round(n || 0).toLocaleString('es-CO');
const tel10 = t => String(t || '').replace(/\D/g, '').slice(-10);
function fechaTxt(ms) { return ms ? new Intl.DateTimeFormat('es-CO', { timeZone: TZ, day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(ms)) : '—'; }
function dia(ms) { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ms)); }
function diaTxt(d) { const [y, m, dd] = d.split('-'); return dd + '/' + m + '/' + y; }
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function mesTxt(m) { const [y, mm] = m.split('-'); return MESES[+mm - 1] + ' ' + y; }
function hace(ms) { const m = Math.round((Date.now() - ms) / 60000); return m < 60 ? m + ' min' : m < 1440 ? Math.round(m / 60) + ' h' : Math.round(m / 1440) + ' d'; }

/* ---------- resultados posibles ---------- */
const RES = {
  conf: [['CONFIRMO','✅ Confirmó','b-green'],['NO_CONTESTA','📵 No contesta','b-amber'],['CAMBIO_DATOS','✏️ Cambió datos','b-blue'],['CANCELA','❌ Cancela','b-red']],
  reparto: [['RECIBE','✅ Avisado, recibe','b-green'],['NO_CONTESTA','📵 No contesta','b-amber'],['REPROGRAMA','📅 Reprograma','b-blue'],['CANCELA','❌ No lo recibe','b-red']],
  novedad: [['SOLUCIONADA','✅ Solucionada','b-green'],['NO_CONTESTA','📵 No contesta','b-amber'],['REPROGRAMA','📅 Reprograma','b-blue'],['CANCELA','❌ No lo quiere','b-red']]
};
const FINAL = { conf: ['CONFIRMO','CAMBIO_DATOS','CANCELA'], reparto: ['RECIBE','REPROGRAMA','CANCELA'], novedad: ['SOLUCIONADA','REPROGRAMA','CANCELA'] };
const TXT_RES = { CONFIRMO:'Confirmó', NO_CONTESTA:'No contesta', CAMBIO_DATOS:'Cambió datos', CANCELA:'Cancela', RECIBE:'Avisado, recibe',
  REPROGRAMA:'Reprograma', SOLUCIONADA:'Solucionada', CONFIRMO_WA:'Confirmó por WhatsApp', PIDE_MODIFICAR:'Pidió modificar (WhatsApp)',
  OBSERVACION:'Observación', OK:'Revisado, bien', REVISAR:'Revisar', NOTA:'Nota' };
const COLOR_RES = r => /CONFIRMO|RECIBE|SOLUCIONADA|OK/.test(r) ? 'c-green' : /CANCELA|REVISAR/.test(r) ? 'c-red' : /NO_CONTESTA|PIDE/.test(r) ? 'c-amber' : 'c-blue';

/* ---------- etapa de Dropi ---------- */
function etapaDropi(e) {
  e = String(e || '').toUpperCase();
  if (/ENTREGAD/.test(e)) return 'entregado';
  if (/DEVOLU|RECHAZ|REHUS/.test(e)) return 'devuelto';
  if (/CANCEL/.test(e)) return 'cancelado';
  if (/NOVEDAD|INTENTO/.test(e)) return 'novedad';
  if (/REPARTO|DISTRIBUCION/.test(e)) return 'reparto';
  return 'camino';
}
const TXT_ETAPA = { entregado: ['Entregado','c-green'], devuelto: ['Devuelto','c-red'], cancelado: ['Cancelado','c-red'], novedad: ['Novedad','c-amber'], reparto: ['En reparto','c-blue'], camino: ['En camino','c-blue'] };

/* ---------- armar los datos ---------- */
function armar(d) {
  const L = d.llamadas || [];
  const porRef = {};
  L.forEach(l => { const k = l.tipo + ':' + l.ref; (porRef[k] = porRef[k] || []).push(l); });
  const ventas = (d.ventas || []).map(v => {
    const id = String(v.id);
    const wa = porRef['wa:' + id] || [], cf = porRef['conf:' + id] || [];
    const pre = /pago:\s*pre/i.test(v.nota), prePend = /PAGO PENDIENTE/i.test(v.estado || '');
    const confWa = wa.find(x => x.resultado === 'CONFIRMO_WA') || (/CONFIRMADO/.test(v.nota) ? { ms: 0 } : null);
    const pideMod = wa.find(x => x.resultado === 'PIDE_MODIFICAR') || (/PIDE MODIFICAR/.test(v.nota) ? { ms: 0 } : null);
    const chat = /james/i.test(v.bot || '');
    const final = cf.filter(x => FINAL.conf.includes(x.resultado)).slice(-1)[0] || null;
    const intentos = cf.filter(x => x.resultado === 'NO_CONTESTA').length;
    const etapa = v.dropi_id ? etapaDropi(v.dropi_estado) : '';
    const origen = confWa ? 'Confirmó por WhatsApp' : pideMod ? 'Pidió modificar datos' : chat ? 'Compró en el chat de James' : (pre && !prePend) ? 'Pagó con Wompi' : '';
    return Object.assign({}, v, { id, total: Number(v.total) || 0, canal: chat ? 'WhatsApp (James)' : 'Página', pre, prePend,
      confWa, pideMod, chat, final, intentos, etapa, origen, llamadas: cf, wa,
      confMs: (confWa && confWa.ms) || (pideMod && pideMod.ms) || (chat || (pre && !prePend) ? v.ms : 0),
      porLlamar: !!origen && !final && !v.rechazado && !v.dropi_id && !prePend && Date.now() - (v.ms || 0) < 5 * 864e5,
      /* 30-09 James: la venta nueva aparece AL INSTANTE para llamar, aunque todavía no confirme por WhatsApp */
      nueva: !origen && !final && !v.rechazado && !v.dropi_id && !prePend && Date.now() - (v.ms || 0) < 5 * 864e5 });
  });
  const dropi = (d.dropi || []).map(x => {
    const id = String(x.id), et = etapaDropi(x.estado);
    const tipo = et === 'novedad' ? 'novedad' : 'reparto';
    const ll = porRef[tipo + ':' + id] || [];
    const final = ll.filter(l => FINAL[tipo].includes(l.resultado)).slice(-1)[0] || null;
    return Object.assign({}, x, { id, etapa: et, tipo, llamadas: ll, final, intentos: ll.filter(l => l.resultado === 'NO_CONTESTA').length,
      venta: ventas.find(v => String(v.dropi_id) === id) || null });
  });
  return { ventas, dropi, llamadas: L };
}

/* ---------- carga ---------- */
async function cargar() {
  if (!PIN) return;
  $('upd').textContent = 'Actualizando…';
  try {
    const r = await fetch(BASE + '/co-operacion?pin=' + encodeURIComponent(PIN) + '&t=' + Date.now(), { cache: 'no-store' });
    const j = await r.json();
    if (!j.ok) { salir(j.error || 'PIN incorrecto'); return; }
    YO = j.yo; DATA = armar(j);
    $('quien').textContent = YO.nombre + ' · ' + YO.rol;
    $('err').style.display = 'none';
    $('upd').textContent = 'Actualizado ' + new Intl.DateTimeFormat('es-CO', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }).format(new Date());
    pintar();
  } catch (e) {
    $('err').textContent = 'No se pudieron traer los datos (' + e.message + '). Se reintenta solo.';
    $('err').style.display = 'block'; $('upd').textContent = 'Sin conexión';
  }
}

/* ---------- navegación ---------- */
function pintar() {
  if (!DATA) return;
  const nLlamar = DATA.ventas.filter(v => v.porLlamar || v.nueva).length;
  const nRep = DATA.dropi.filter(x => x.etapa === 'reparto' && !x.final).length;
  const nNov = DATA.dropi.filter(x => x.etapa === 'novedad' && !x.final).length;
  const items = [['llamar', '📞 Por llamar', nLlamar], ['reparto', '🚚 En reparto', nRep], ['novedad', '⚠️ Novedad', nNov], ['ventas', '📊 Ventas y totales', null]];
  if (YO && YO.rol === 'auditor') items.push(['auditoria', '🔎 Auditoría', null]);
  if (!items.some(i => i[0] === vista)) vista = 'llamar';
  $('nav').innerHTML = items.map(([k, t, n]) => '<button data-v="' + k + '" class="' + (k === vista ? 'act' : '') + '">' + t +
    (n != null ? '<span class="n' + (n ? ' hot' : '') + '">' + n + '</span>' : '') + '</button>').join('');
  ({ llamar: vLlamar, reparto: () => vDropi('reparto'), novedad: () => vDropi('novedad'), ventas: vVentas, auditoria: vAuditoria })[vista]();
}

/* ---------- POR LLAMAR (confirmación) ---------- */
function vLlamar() {
  const orden = (a, b) => (a.confMs || a.ms) - (b.confMs || b.ms);
  const L = DATA.ventas.filter(v => v.porLlamar).sort(orden);
  const N = DATA.ventas.filter(v => v.nueva).sort(orden);
  let h = '<div class="aviso">Toda venta nueva aparece aquí <b>al instante</b>, con el teléfono para llamar. Arriba, los que <b>ya confirmaron</b> (botón de WhatsApp, chat de James o pago con Wompi); abajo, los que <b>todavía no contestan</b> la plantilla. Llama y marca el resultado: <b>James lo ve enseguida en su panel</b>.</div>';
  if (!L.length && !N.length) { $('vista').innerHTML = h + '<div class="card"><div class="empty"><b>No hay clientes por llamar</b><p>Cuando entre una venta, aparece aquí sola. La página se actualiza cada 30 segundos.</p></div></div>'; return; }

/* ---------- VENTAS Y TOTALES ---------- */
function enPeriodo(ms) {
  if (!ms) return false;
  const d = dia(ms), hoy = dia(Date.now());
  if (periodo === 'todo') return true;
  if (periodo === 'hoy') return d === hoy;
  if (periodo === 'ayer') return d === dia(Date.now() - 864e5);
  if (periodo === '7d') return d >= dia(Date.now() - 6 * 864e5);
  if (periodo === 'mes') return d.slice(0, 7) === hoy.slice(0, 7);
  if (periodo === 'mesant') { const x = new Date(); x.setDate(1); x.setMonth(x.getMonth() - 1); return d.slice(0, 7) === dia(x.getTime()).slice(0, 7); }
  if (periodo === 'rango') return (!desde || d >= desde) && (!hasta || d <= hasta);
  return true;
}
function estadoVenta(v) {
  if (v.etapa) return TXT_ETAPA[v.etapa];
  if (v.rechazado) return ['Rechazada', 'c-red'];
  if (v.prePend) return ['Esperando pago Wompi', 'c-amber'];
  if (v.aprobado) return ['Aprobada · sin montar', 'c-blue'];
  if (v.final) return [v.final.resultado === 'CANCELA' ? 'Canceló por llamada' : 'Llamada hecha', v.final.resultado === 'CANCELA' ? 'c-red' : 'c-green'];
  if (v.porLlamar) return ['Por llamar', 'c-amber'];
  return ['Esperando confirmación', 'c-gray'];
}
function totales(arr) {
  const t = { n: arr.length, valor: 0, confWa: 0, llamOk: 0, aprob: 0, dropi: 0, ent: 0, dev: 0, recaudo: 0 };
  arr.forEach(v => {
    t.valor += v.total;
    if (v.confWa || v.chat || (v.pre && !v.prePend)) t.confWa++;
    if (v.final && v.final.resultado !== 'CANCELA') t.llamOk++;
    if (v.aprobado) t.aprob++;
    if (v.dropi_id) t.dropi++;
    if (v.etapa === 'entregado') { t.ent++; t.recaudo += v.total; }
    if (v.etapa === 'devuelto') t.dev++;
  });
  return t;
}
function vVentas() {
  const arr = DATA.ventas.filter(v => enPeriodo(v.ms) && (!qBuscar || [v.nombre, v.telefono, v.comuna, v.region, v.guia, v.producto].join(' ').toLowerCase().includes(qBuscar)));
  const t = totales(arr), pct = t.ent + t.dev ? Math.round(t.ent * 100 / (t.ent + t.dev)) + '%' : '—';
  const P = [['hoy','Hoy'],['ayer','Ayer'],['7d','7 días'],['mes','Este mes'],['mesant','Mes pasado'],['todo','Todo'],['rango','Fechas…']];
  let h = '<div class="bar"><div class="seg" id="segPer">' + P.map(([k, x]) => '<button data-p="' + k + '" class="' + (k === periodo ? 'act' : '') + '">' + x + '</button>').join('') + '</div>' +
    (periodo === 'rango' ? '<input type="date" id="fDesde" value="' + desde + '"> <input type="date" id="fHasta" value="' + hasta + '">' : '') +
    '<input type="search" id="q" placeholder="Buscar cliente, teléfono, ciudad o guía" value="' + esc(qBuscar) + '"></div>';
  h += '<div class="kpis">' +
    kpi('Ventas', t.n, '', 'en el periodo') + kpi('Valor vendido', cop(t.valor), 'blue', 'COP') +
    kpi('Confirmadas', t.confWa, 'green', 'WhatsApp, chat o Wompi') + kpi('Confirmadas por llamada', t.llamOk, 'green', '') +
    kpi('Aprobadas', t.aprob, '', 'por James') + kpi('En Dropi', t.dropi, 'blue', 'montadas') +
    kpi('Entregadas', t.ent, 'green', '') + kpi('Devoluciones', t.dev, 'red', '') +

  /* totales por día y por mes */
  const agrupar = f => { const m = {}; arr.forEach(v => { const k = f(v); (m[k] = m[k] || []).push(v); }); return Object.keys(m).sort().reverse().map(k => [k, totales(m[k])]); };
  const tablaTot = (filas, fmt) => '<div class="card"><table><thead><tr><th>' + (fmt === diaTxt ? 'Día' : 'Mes') + '</th><th class="num">Ventas</th><th class="num">Valor</th><th class="num hide-m">Confirm.</th><th class="num hide-m">Llamada OK</th><th class="num">Entreg.</th><th class="num">Devol.</th></tr></thead><tbody>' +
    filas.map(([k, x]) => '<tr><td>' + esc(fmt(k)) + '</td><td class="num">' + x.n + '</td><td class="num">' + cop(x.valor) + '</td><td class="num hide-m">' + x.confWa + '</td><td class="num hide-m">' + x.llamOk + '</td><td class="num">' + x.ent + '</td><td class="num">' + x.dev + '</td></tr>').join('') +

  if (arr.length) {

      '<td class="num"><b>' + cop(v.total) + '</b></td>' +

      '<td><span class="chip ' + e[1] + '">' + esc(e[0]) + '</span></td>' +
      '<td class="hide-m">' + esc(v.guia || '—') + '<div class="muted">' + esc(v.transportadora || '') + '</div></td></tr>'; }).join('') +
    '</tbody></table></div>' : '<div class="card"><div class="empty"><b>Sin ventas en este periodo</b></div></div>';
  $('vista').innerHTML = h;
  $('segPer').onclick = e => { const b = e.target.closest('button'); if (!b) return; periodo = b.dataset.p; pintar(); };

}

async function guardar(tipo, resultado, ref) {

  document.querySelectorAll('[data-g]').forEach(b => b.disabled = true);
  $('gMsg').textContent = 'Guardando…';
  try {
    const r = await fetch(BASE + '/co-llamada', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: PIN, tipo, ref, resultado, nota }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'no se guardó');
    $('ov').classList.remove('on');
    await cargar();
  } catch (e) {
    $('gMsg').textContent = 'No se guardó: ' + e.message + '. Inténtalo otra vez.';
    document.querySelectorAll('[data-g]').forEach(b => b.disabled = false);
  }
}

/* ---------- eventos ---------- */
$('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; vista = b.dataset.v; pintar(); });
$('vista').addEventListener('click', e => { const tr = e.target.closest('tr.cl'); if (!tr) return; if (tr.dataset.venta) verVenta(tr.dataset.venta); else if (tr.dataset.dropi) verDropi(tr.dataset.dropi); });
$('mb').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (!b) return; const [t, r, ref] = b.dataset.g.split('|'); guardar(t, r, ref); });
$('mx').addEventListener('click', () => $('ov').classList.remove('on'));
$('ov').addEventListener('click', e => { if (e.target === $('ov')) $('ov').classList.remove('on'); });
$('btnRef').addEventListener('click', cargar);

function salir(msg) { PIN = ''; DATA = null; try { localStorage.removeItem('co_equipo_pin'); } catch (e) {} $('pinErr').textContent = msg || ''; $('login').classList.add('on'); $('pin').value = ''; $('pin').focus(); }
$('btnSalir').addEventListener('click', () => salir(''));
async function entrar() {
  const p = $('pin').value.trim(); if (!p) return;
  $('pinErr').textContent = 'Revisando…';
  PIN = p;
  try {
    const r = await fetch(BASE + '/co-operacion?pin=' + encodeURIComponent(p) + '&t=' + Date.now(), { cache: 'no-store' });
    const j = await r.json();
    if (!j.ok) { PIN = ''; $('pinErr').textContent = 'PIN incorrecto'; return; }
    try { localStorage.setItem('co_equipo_pin', p); } catch (e) {}
    $('login').classList.remove('on'); $('pinErr').textContent = '';
    YO = j.yo; DATA = armar(j); $('quien').textContent = YO.nombre + ' · ' + YO.rol; pintar();
  } catch (e) { PIN = ''; $('pinErr').textContent = 'Sin conexión, inténtalo otra vez'; }
}
$('btnPin').addEventListener('click', entrar);
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

function ponerTema(t) { document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('jaye_tema', t); } catch (e) {} }
$('btnTema').addEventListener('click', () => ponerTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
(function () {
  let t = null; try { t = localStorage.getItem('jaye_tema'); } catch (e) {}
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  try { PIN = localStorage.getItem('co_equipo_pin') || ''; } catch (e) {}
  if (PIN) cargar(); else $('login').classList.add('on');
})();
setInterval(() => { if (PIN && !$('ov').classList.contains('on')) cargar(); }, 15000);

/* ---------- 30-09 James: que le aparezca AL INSTANTE a quien llama ----------
   1) si se publica una versión nueva de esta página, se recarga sola
   2) cuando entra una venta nueva o un cliente confirma: suena, vibra, notificación
      y el título de la pestaña muestra cuántos hay por llamar */
const VERSION = '2026-09-30-d';
setInterval(async () => {
  try {
    const t = await (await fetch('index.html?ping=' + Date.now(), { cache: 'no-store' })).text();
    const m = t.match(/const VERSION = '([^']+)'/);
    if (m && m[1] !== VERSION && !$('ov').classList.contains('on')) location.reload();
  } catch (e) {}
}, 60000);
let _vistos = null;
function sonar() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach(d => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(0.25, c.currentTime + d); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d + 0.2); o.start(c.currentTime + d); o.stop(c.currentTime + d + 0.2); });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
}
function avisarNuevos() {
  if (!DATA) return;
  const lista = DATA.ventas.filter(v => v.porLlamar || v.nueva);
  const claves = lista.map(v => v.id + (v.porLlamar ? ':c' : ':n'));
  document.title = (lista.length ? '(' + lista.length + ') ' : '') + 'Equipo Colombia · Jaye Group';
  if (_vistos === null) { _vistos = new Set(claves); return; }
  const nuevos = lista.filter((v, i) => !_vistos.has(claves[i]));
  claves.forEach(k => _vistos.add(k));
  if (!nuevos.length) return;
  sonar();
  const v = nuevos[0];
  const txt = (v.porLlamar ? '✅ Confirmó: ' : '🆕 Venta nueva: ') + v.nombre + ' · ' + cop(v.total) + (nuevos.length > 1 ? ' (y ' + (nuevos.length - 1) + ' más)' : '');
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification('📞 Por llamar · Colombia', { body: txt, tag: 'co-llamar' }); } catch (e) {}
  const b = document.createElement('div');
  b.textContent = txt + ' · toca para ver';
  b.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:70;background:#179f6b;color:#fff;font-weight:800;padding:14px 16px;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.3);cursor:pointer;text-align:center';
  b.onclick = () => { vista = 'llamar'; pintar(); b.remove(); };
  document.body.appendChild(b); setTimeout(() => b.remove(), 20000);
}
const _pintarBase = pintar;
pintar = function () { _pintarBase(); avisarNuevos(); };
/* el navegador solo deja pedir permiso de notificaciones después de un toque */
document.addEventListener('click', function pedirPermiso() {
  try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
  document.removeEventListener('click', pedirPermiso);
});
</script>
