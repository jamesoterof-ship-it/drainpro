<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Llamadas de novedades · Jaye Group</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--ink2:#5b6475;--line:#dde1e8;--head:#2f343c;--amarillo:#fff4c2;--amarillo2:#f3e39a;--ok:#e3f4ea;--okt:#17663a;--warn:#fdf0d9;--warnt:#8a5300;--mal:#fde6e4;--malt:#9b1c1c;--azul:#1f6fb2;--gris:#eef0f3}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:var(--ink);background:var(--bg)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:16px;margin:0;font-weight:700}
.sub{color:var(--ink2);font-size:12px}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtros button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--ink)}
.filtros button.on{background:var(--head);color:#fff;border-color:var(--head)}
.spacer{flex:1}
.estado{font-size:12px;color:var(--ink2)}
#aviso{margin:10px 16px 0;padding:10px 12px;border-radius:8px;background:var(--gris);color:var(--ink2);font-size:12px;line-height:1.5}
.wrap{margin:12px 16px 24px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 150px)}
table{border-collapse:separate;border-spacing:0;min-width:2550px;width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
th{position:sticky;top:0;background:var(--head);color:#fff;font-size:12px;font-weight:700;z-index:2;white-space:nowrap}
th.am{background:#e0c64f;color:#2b2300}
td.am{background:var(--amarillo)}
tr.guardada td.am{background:#f7f0cf}
tbody tr{background:#fff}
tbody tr:nth-child(even){background:#fafbfc}
.nom{font-weight:700;min-width:150px}
.chip{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.c-dir{background:var(--mal);color:var(--malt)}
.c-rep{background:#e6eefb;color:#1b4f9c}
.c-no{background:var(--gris);color:var(--ink2)}
.c-conf{background:var(--ok);color:var(--okt)}
.resp{font-weight:700;color:var(--ink);margin-bottom:2px}
.tel a{color:var(--azul);text-decoration:none;font-weight:700;white-space:nowrap}
.wa{display:inline-block;margin-top:3px;font-size:11px;color:#128c4a;text-decoration:none;font-weight:700}
.dir{min-width:220px;max-width:280px}
.msg{min-width:200px;max-width:260px;color:var(--ink2)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dias5{color:var(--malt);font-weight:700}
select,input,textarea{font:inherit;font-size:13px;width:100%;border:1px solid #cdbf7a;border-radius:6px;padding:5px 6px;background:#fffdf3;color:var(--ink)}
textarea{resize:vertical;line-height:1.4}
textarea.corta{min-height:70px}
textarea.media{min-height:110px}
textarea.grande{min-height:150px}
td.cres{min-width:190px}
td.cfec{min-width:170px}
td.cdir{min-width:230px}
td.cnota,th.nota{min-width:380px}
td.mot{min-width:150px;font-weight:700}
select:focus,input:focus,textarea:focus{outline:2px solid #b89b16;outline-offset:0}
.btn{border:0;background:var(--head);color:#fff;border-radius:6px;padding:7px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:wait}
.gest{min-width:230px;max-width:300px;line-height:1.4}
.g-ok{color:var(--okt);font-weight:700}
.g-warn{color:var(--warnt);font-weight:700}
.g-mal{color:var(--malt);font-weight:700}
/* 21-09 James: "ponle una nota de lo que hemos hecho antes de que ella llame" */
.yah{min-width:250px;max-width:320px;font-size:12px;line-height:1.5;color:var(--ink2)}
.yah b{color:var(--ink)}
.yah .si{color:var(--okt);font-weight:700}
.yah .no{color:var(--malt);font-weight:700}
.yah .ll{display:block;margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);color:var(--azul);font-weight:700}
.hist{margin-top:4px;font-size:11px;color:var(--ink2);white-space:pre-line}
.err{color:var(--malt);font-size:11px;margin-top:3px}
.vacio{padding:30px;text-align:center;color:var(--ink2)}
.bloqueo{max-width:420px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;text-align:center;line-height:1.6}
[hidden]{display:none!important}
/* pestaña Estado de las novedades */
.c-warn{background:var(--warn);color:var(--warnt)}
.resumen{display:flex;flex-wrap:wrap;gap:8px;margin:10px 16px 0}
.resumen button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;min-width:120px;font:inherit;color:var(--ink)}
.resumen button b{font-size:20px;font-variant-numeric:tabular-nums}
.resumen button span{font-size:11px;color:var(--ink2)}
.resumen button.on{border-color:var(--head);box-shadow:inset 0 0 0 1px var(--head)}
.resumen .r-ent b{color:var(--okt)} .resumen .r-dev b{color:var(--malt)} .resumen .r-rep b{color:#1b4f9c} .resumen .r-nov b{color:var(--warnt)}
table.est{min-width:1500px}
.si{color:var(--okt);font-weight:700}
.si-mal{color:var(--malt);font-weight:700}
.nop{color:var(--ink2)}
.cuando{display:block;font-size:11px;color:var(--ink2);font-weight:400;white-space:nowrap}
.rec{white-space:pre-line;font-size:11px;color:var(--ink2);min-width:210px;line-height:1.5}
.dropi{display:block;margin-top:4px;font-size:11px;color:var(--ink2)}
@media (max-width:700px){.resumen{margin:8px 8px 0}.resumen button{min-width:calc(50% - 4px)}}
@media (max-width:700px){header{padding:10px 12px}.wrap{margin:10px 8px 20px;max-height:none}#aviso{margin:8px 8px 0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var BASE = 'https://n8n-production-8a42.up.railway.app/webhook';
  var RESULTADOS = ['Recibe - reintentar entrega','Da otra fecha','Da dirección nueva','Retira en sucursal','No quiere el pedido','No contesta','Número equivocado'];

  /* la clave llega una vez por el enlace (?k=...) y queda guardada en este navegador */
  var clave = '';
  try {
    var u = new URL(location.href);
    if (u.searchParams.get('k')) { clave = u.searchParams.get('k'); try { localStorage.setItem('jaye_llamadas_k', clave); } catch (e) {} u.searchParams.delete('k'); history.replaceState(null, '', u.pathname + (u.search || '')); }
    if (!clave) { try { clave = localStorage.getItem('jaye_llamadas_k') || ''; } catch (e) {} }
  } catch (e) {}

  var app = document.getElementById('app');
  var filas = [], filtro = 'llamar', editando = {}, quien = '';
  var subEstado = 'todas';
  try { filtro = localStorage.getItem('jaye_llamadas_filtro') || 'llamar'; } catch (e) {}
  if (filtro === 'seguimiento') filtro = 'estado';

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function clp(n){ return '$' + Number(n || 0).toLocaleString('es-CL'); }
  function telFmt(t){ t = String(t || '').replace(/\D/g, '').slice(-9); return t.length === 9 ? '+56 ' + t[0] + ' ' + t.slice(1,5) + ' ' + t.slice(5) : t; }

  function bloqueo(txt){ app.innerHTML = '<div class="bloqueo"><h1>Llamadas de novedades</h1><p>' + esc(txt) + '</p></div>'; }
  if (!clave) { bloqueo('Abre esta página con el enlace que te enviaron.'); return; }

  app.innerHTML =
    '<header><div><h1>Llamadas de novedades</h1><div class="sub" id="sub">Cargando…</div></div>' +
    '<div class="filtros" id="filtros"></div><div class="spacer"></div><div class="estado" id="estado"></div></header>' +
    '<div id="aviso">Llama en orden de arriba hacia abajo. Elige el <b>resultado</b>, escribe la fecha, la dirección nueva y la <b>nota de la llamada</b>, y toca <b>Guardar</b>: se gestiona en Dropi en ese momento. ' +
    'Aunque el cliente haya contestado el mensaje, igual llámalo para reforzar. En la columna <b>Lo que ya se hizo</b> ves cuántos mensajes se le mandaron, si contestó y qué se gestionó, para que no le repitas lo mismo. Aquí están <b>todas</b> las novedades abiertas de los últimos 7 días, aunque el sistema ya las haya reprogramado: llama para confirmar. Cada una sale cuando guardas la llamada. No aparecen las entregadas, las devueltas, las segundas novedades ni los clientes que dijeron que no quieren el pedido. En la pestaña Estado de las novedades se ve si salió a reparto, se entregó o se devolvió. Recuerda: el cliente paga al recibir. Nunca prometas día ni hora exacta. Nunca ofrezcas descuentos ni anular el pedido.</div>' +
    '<div id="resumen" class="resumen" hidden></div>' +
    '<div class="wrap" id="wrapEst" hidden><table class="est"><thead><tr>' +
    '<th>Estado ahora</th><th>Cliente</th><th>Producto y valor</th><th>Motivo de la novedad</th><th>Novedad</th><th>Qué se hizo</th>' +
    '<th>¿Salió a reparto?</th><th>¿Se entregó?</th><th>¿Devolución?</th><th>Recorrido en Dropi desde la novedad</th><th>Pedido Dropi / guía</th>' +
    '</tr></thead><tbody id="tbEst"></tbody></table></div>' +
    '<div class="wrap" id="wrapLlamar"><table><thead><tr>' +
    '<th>Novedad / estado actual</th><th>Lo que ya se hizo</th><th>Motivo de la novedad</th><th>Aviso enviado (hora Chile)</th><th>Días en entrega</th><th>Lo que contestó al mensaje</th><th>Gestión ya hecha</th>' +
    '<th>Cliente</th><th>Teléfono</th><th>Dirección</th><th>Ciudad</th><th>Producto</th><th>Valor a pagar</th><th>Pedido Dropi</th><th>Guía</th>' +
    '<th class="am">Resultado de la llamada</th><th class="am">Fecha u horario que da</th><th class="am">Dirección nueva o referencia</th><th class="am nota">Nota de la llamada</th><th class="am"></th><th>Gestión en Dropi</th>' +
    '</tr></thead><tbody id="tb"></tbody></table></div>';

  var tb = document.getElementById('tb'), tbEst = document.getElementById('tbEst');

  function grupo(f){
    return f.pendiente ? 'llamar' : 'seguimiento';
  }
  function pintarFiltros(){
    var n = { llamar: 0, seguimiento: 0, estado: filas.length, todas: filas.length };
    filas.forEach(function(f){ n[grupo(f)]++; });
    var defs = [['llamar','Por llamar'],['estado','Estado de las novedades'],['todas','Todas']];
    document.getElementById('filtros').innerHTML = defs.map(function(d){ return '<button data-f="' + d[0] + '" class="' + (filtro === d[0] ? 'on' : '') + '">' + d[1] + ' · ' + n[d[0]] + '</button>'; }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#filtros button'), function(b){ b.onclick = function(){ filtro = b.getAttribute('data-f'); try { localStorage.setItem('jaye_llamadas_filtro', filtro); } catch (e) {} pintar(); }; });
  }

  function claseGestion(g){
    if (!g) return '';
    if (/reprogramada|confirma/i.test(g)) return 'g-ok';
    if (/rechaz|no respondi|falta/i.test(g)) return 'g-mal';
    return 'g-warn';
  }

  function fila(f){
    var tel = String(f.telefono || '').replace(/\D/g, '').slice(-9);
    var esDir = /direcci/i.test(f.que_hacer);
    var chip;
    /* si Dropi ya no la tiene en novedad (el sistema ya la reprogramó), la llamada es para confirmar */
    if (f.pendiente) chip = String(f.estado || '').toUpperCase() !== 'NOVEDAD'
      ? '<span class="chip c-conf">Confirmar: ya reprogramada</span>'
      : '<span class="chip ' + (esDir ? 'c-dir' : 'c-rep') + '">' + esc(f.que_hacer) + '</span>';
    else {
      var e = String(f.estado || '').toUpperCase().replace(/_/g, ' ');
      var cls = /ENTREGADO/.test(e) ? 'c-conf' : (/DEVOLUCI|RECHAZ/.test(e) ? 'c-dir' : (/REPARTO/.test(e) ? 'c-rep' : 'c-no'));
      var txt = /ENTREGADO/.test(e) ? 'Entregado' + (f.entregado ? ' ' + f.entregado : '') : (/DEVOLUCI/.test(e) ? 'Devolución' : (/REPARTO/.test(e) ? 'En reparto' : (/PENDIENTE JAMES/i.test(f.resultado_gestion || '') ? 'Frenada: decide James' : e === 'NOVEDAD SOLUCIONADA' ? 'Reprogramada, esperando reparto' : (e === 'NOVEDAD' ? (/PENDIENTE JAMES/i.test(f.resultado_gestion || '') ? 'Frenada: decide James' : 'Novedad') : e.charAt(0) + e.slice(1).toLowerCase()))));
      chip = '<span class="chip ' + cls + '">' + esc(txt) + '</span>';
    }
    var contesto = f.contesto ? '<div class="resp">Se le envió mensaje y contestó:</div>' + esc(f.contesto).split(String.fromCharCode(10)).join('<br>') : 'No contestó el mensaje' + (f.ultimo_msg ? '<div class="sub">Último mensaje antes: ' + esc(f.ultimo_msg_h) + ': ' + esc(String(f.ultimo_msg).slice(0, 120)) + '</div>' : '');
    var opciones = '<option value="">Elegir…</option>' + RESULTADOS.map(function(r){ return '<option' + (f.resultado === r ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('');

    /* 21-09 James: la nota de lo que ya se hizo, para que ella sepa antes de marcar y no le
       repita al cliente lo mismo. Sale de los avisos que se le mandaron, de los mensajes que
       el cliente escribió después del aviso y de las gestiones que ya se hicieron en Dropi. */
    var ya = [], nMsg = Number(f.msgs_n || 0), nTras = Number(f.resp_tras_aviso || 0);
    if (nMsg) ya.push('<b>' + nMsg + ' mensaje' + (nMsg > 1 ? 's' : '') + ' ya enviado' + (nMsg > 1 ? 's' : '') + ':</b> ' + esc(f.msgs_detalle || ''));
    else ya.push('<span class="no">Todavía no se le ha mandado ningún mensaje</span>');
    if (nTras > 0) ya.push('<span class="si">El cliente SÍ contestó el aviso</span> · ' + nTras + ' mensaje' + (nTras > 1 ? 's' : '') + ', el último ' + esc(f.resp_ult || ''));
    else if (Number(f.resp_n || 0) > 0) ya.push('<span class="no">No contestó el aviso de novedad.</span> Su último mensaje fue el ' + esc(f.resp_ult || ''));
    else ya.push('<span class="no">El cliente nunca ha escrito.</span> Vas a llamar en frío');
    if (f.gestiones) ya.push('<b>Ya se gestionó en Dropi:</b> ' + esc(f.gestiones));
    else ya.push('<span class="no">Todavía NO se ha gestionado en Dropi</span>');
    if (Number(f.llamadas || 0) > 0) ya.push('<b>Ya se le llamó ' + f.llamadas + ' vez' + (f.llamadas > 1 ? 'ces' : '') + ' antes</b>');
    ya.push('<span class="ll">Llámalo igual para confirmar</span>');

    return '<tr data-id="' + esc(f.pedido) + '" class="' + (f.resultado ? 'guardada' : '') + '">' +
      '<td>' + chip + (f.llamadas ? '<div class="sub">' + f.llamadas + ' llamada' + (f.llamadas > 1 ? 's' : '') + '</div>' : '') + '</td>' +
      '<td class="yah">' + ya.join('<br>') + '</td>' +
      '<td class="mot">' + esc(f.motivo || '—') + '</td>' +
      '<td>' + esc(f.aviso) + '</td>' +
      '<td class="num ' + (Number(f.dias) >= 5 ? 'dias5' : '') + '">' + esc(f.dias) + '</td>' +
      '<td class="msg">' + contesto + '</td>' +
      '<td class="msg">' + esc(f.gestion_previa || 'Sin gestionar todavía') + '</td>' +
      '<td><div class="nom">' + esc(f.nombre) + '</div></td>' +
      '<td class="tel"><a href="tel:+56' + tel + '">' + esc(telFmt(tel)) + '</a><br><a class="wa" href="https://wa.me/56' + tel + '" target="_blank" rel="noopener">Abrir WhatsApp</a></td>' +
      '<td class="dir">' + esc(f.direccion || 'ver en Dropi') + '</td>' +
      '<td>' + esc(f.ciudad) + '</td>' +
      '<td>' + esc(f.producto) + '</td>' +
      '<td class="num">' + clp(f.valor) + '</td>' +
      '<td class="num">' + esc(f.pedido) + '</td>' +
      '<td>' + esc(f.guia || 'sin guía') + '<div class="sub">' + esc(f.transportadora || '') + '</div></td>' +
      '<td class="am cres"><select data-c="resultado">' + opciones + '</select></td>' +
      '<td class="am cfec"><textarea class="corta" data-c="fecha_horario" placeholder="jueves en la tarde">' + esc(f.fecha_horario || '') + '</textarea></td>' +
      '<td class="am cdir"><textarea class="media" data-c="direccion_nueva" placeholder="calle, número y una referencia">' + esc(f.direccion_nueva || '') + '</textarea></td>' +
      '<td class="am cnota"><textarea class="grande" data-c="nota" placeholder="Escribe aquí todo lo que se habló en la llamada">' + esc(f.nota || '') + '</textarea></td>' +
      '<td class="am"><button class="btn" data-g="1">Guardar</button><div class="err"></div></td>' +
      '<td class="gest">' + (f.gestion ? '<div class="' + claseGestion(f.gestion) + '">' + esc(f.gestion) + '</div><div class="sub">' + esc(f.guardado || '') + (f.por ? ' · ' + esc(f.por) : '') + '</div>' : '<span class="sub">Sin llamar todavía</span>') +
        (f.historial && f.llamadas > 1 ? '<div class="hist">' + esc(f.historial) + '</div>' : '') + '</td>' +
      '</tr>';
  }

  /* ---- pestaña Estado de las novedades: qué pasó con cada novedad después ---- */
  function norm(s){ return String(s || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split('_').join(' ').trim(); }
  function bonito(s){ s = norm(s); return s ? s.charAt(0) + s.slice(1).toLowerCase() : ''; }
  function estadoDe(f){
    var E = norm(f.estado || f.s_estado);
    if (f.s_devolucion || E.indexOf('DEVOLUCI') >= 0) return { k: 'dev', t: 'Devolución', cls: 'c-dir' };
    if (f.s_entregado || E === 'ENTREGADO') return { k: 'ent', t: 'Entregado', cls: 'c-conf' };
    if (E === 'NOVEDAD' && f.segunda) return { k: 'nov', t: 'Segunda novedad · va a devolución (no se llama)', cls: 'c-dir' };
    if (E === 'NOVEDAD') return { k: 'nov', t: f.pendiente ? 'En novedad · por llamar' : (/PENDIENTE JAMES/i.test(f.resultado_gestion || '') ? 'En novedad · decide James' : 'En novedad'), cls: 'c-warn' };
    if (E.indexOf('REPARTO') >= 0) return { k: 'rep', t: 'En reparto', cls: 'c-rep' };
    if (E.indexOf('OFICINA') >= 0 || E.indexOf('RETIRO') >= 0 || E.indexOf('SUCURSAL') >= 0) return { k: 'rep', t: 'En oficina de la transportadora', cls: 'c-rep' };
    return { k: 'esp', t: 'Reprogramada, esperando reparto', cls: 'c-no' };
  }
  function siNo(si, cuando, mal, extra){
    return si ? '<span class="' + (mal ? 'si-mal' : 'si') + '">Sí' + (extra ? ' · ' + esc(extra) : '') + '</span>' + (cuando ? '<span class="cuando">' + esc(cuando) + '</span>' : '') : '<span class="nop">No</span>';
  }
  function filaEst(f){
    var st = estadoDe(f), E = norm(f.estado || f.s_estado);
    var tel = String(f.telefono || '').replace(/\D/g, '').slice(-9);
    var repartoSi = !!f.s_reparto || E.indexOf('REPARTO') >= 0 || !!f.s_entregado || E === 'ENTREGADO';
    var hecho = f.gestion ? 'Llamada: ' + f.gestion + (f.guardado ? ' (' + f.guardado + ')' : '') : (f.gestion_previa || 'Sin gestionar todavía');
    var sinDatos = !f.s_revisado;
    return '<tr>' +
      '<td><span class="chip ' + st.cls + '">' + esc(st.t) + '</span><span class="dropi">Dropi: ' + esc(bonito(f.estado || f.s_estado)) + '</span></td>' +
      '<td><div class="nom">' + esc(f.nombre) + '</div><a class="wa" href="https://wa.me/56' + tel + '" target="_blank" rel="noopener">' + esc(telFmt(tel)) + '</a><div class="sub">' + esc(f.ciudad || '') + '</div></td>' +
      '<td>' + esc(f.producto) + '<div class="sub">' + clp(f.valor) + '</div></td>' +
      '<td class="mot">' + esc(f.motivo || '—') + '</td>' +
      '<td style="white-space:nowrap">' + esc(f.s_novedad || f.aviso) + (Number(f.s_novedades) > 1 ? '<div class="g-mal">' + f.s_novedades + ' novedades</div>' : '') + '</td>' +
      '<td class="msg">' + esc(hecho) + '</td>' +
      '<td>' + (sinDatos && !repartoSi ? '<span class="nop">Revisando…</span>' : siNo(repartoSi, f.s_reparto, false, Number(f.s_repartos) > 1 ? f.s_repartos + ' veces' : '')) + '</td>' +
      '<td>' + siNo(st.k === 'ent', f.s_entregado, false) + '</td>' +
      '<td>' + siNo(st.k === 'dev', f.s_devolucion, true) + '</td>' +
      '<td class="rec">' + (f.s_recorrido ? esc(f.s_recorrido) : '<span class="nop">Se carga de Dropi cada 15 minutos</span>') + '</td>' +
      '<td class="num">' + esc(f.pedido) + '<div class="sub">' + esc(f.guia || 'sin guía') + ' · ' + esc(f.transportadora || '') + '</div></td>' +
      '</tr>';
  }
  function pintarEstado(){
    var grupos = [['todas','Todas las novedades',''],['ent','Entregados','r-ent'],['rep','En reparto','r-rep'],['esp','Reprogramadas, esperando reparto','r-esp'],['nov','Siguen en novedad','r-nov'],['dev','Devoluciones','r-dev']];
    var n = { todas: filas.length, ent: 0, rep: 0, esp: 0, nov: 0, dev: 0 };
    filas.forEach(function(f){ n[estadoDe(f).k]++; });
    var res = document.getElementById('resumen');
    res.innerHTML = grupos.map(function(g){ return '<button class="' + g[2] + (subEstado === g[0] ? ' on' : '') + '" data-s="' + g[0] + '"><b>' + n[g[0]] + '</b><span>' + g[1] + '</span></button>'; }).join('');
    Array.prototype.forEach.call(res.querySelectorAll('button'), function(b){ b.onclick = function(){ subEstado = b.getAttribute('data-s'); pintarEstado(); }; });
    var lista = filas.filter(function(f){ return subEstado === 'todas' || estadoDe(f).k === subEstado; });
    tbEst.innerHTML = lista.length ? lista.map(filaEst).join('') : '<tr><td colspan="11" class="vacio">No hay novedades en este grupo.</td></tr>';
  }

  function pintar(){
    pintarFiltros();
    var esEst = filtro === 'estado';
    document.getElementById('wrapEst').hidden = !esEst;
    document.getElementById('resumen').hidden = !esEst;
    document.getElementById('wrapLlamar').hidden = esEst;
    document.getElementById('aviso').hidden = esEst;
    if (esEst) { pintarEstado(); return; }
    var lista = filas.filter(function(f){ return filtro === 'todas' || grupo(f) === filtro; });
    if (!lista.length) { tb.innerHTML = '<tr><td colspan="20" class="vacio">' + (filtro === 'llamar' ? 'No hay novedades por llamar ahora.' : 'Sin novedades en seguimiento.') + '</td></tr>'; return; }
    tb.innerHTML = lista.map(fila).join('');
    Array.prototype.forEach.call(tb.querySelectorAll('tr[data-id]'), function(tr){
      var id = tr.getAttribute('data-id');
      Array.prototype.forEach.call(tr.querySelectorAll('[data-c]'), function(el){ el.addEventListener('input', function(){ editando[id] = true; }); el.addEventListener('change', function(){ editando[id] = true; }); });
      tr.querySelector('[data-g]').onclick = function(){ guardar(tr, id); };
    });
  }

  function valor(tr, c){ var el = tr.querySelector('[data-c="' + c + '"]'); return el ? el.value : ''; }

  function guardar(tr, id){
    var btn = tr.querySelector('[data-g]'), err = tr.querySelector('.err');
    var datos = { k: clave, order_id: id, resultado: valor(tr, 'resultado'), fecha_horario: valor(tr, 'fecha_horario'), direccion_nueva: valor(tr, 'direccion_nueva'), nota: valor(tr, 'nota') };
    err.textContent = '';
    if (!datos.resultado) { err.textContent = 'Elige el resultado de la llamada.'; return; }
    if (datos.resultado === 'Da dirección nueva' && !datos.direccion_nueva.trim()) { err.textContent = 'Escribe la dirección nueva.'; return; }
    if (datos.resultado === 'Da otra fecha' && !datos.fecha_horario.trim()) { err.textContent = 'Escribe la fecha u horario.'; return; }
    btn.disabled = true; btn.textContent = 'Guardando…';
    fetch(BASE + '/llamadas-guardar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) { err.textContent = j.error || 'No se pudo guardar. Intenta de nuevo.'; btn.disabled = false; btn.textContent = 'Guardar'; return; }
        delete editando[id];
        var f = filas.filter(function(x){ return x.pedido === id; })[0];
        if (f) { f.resultado = datos.resultado; f.fecha_horario = datos.fecha_horario; f.direccion_nueva = datos.direccion_nueva; f.nota = datos.nota; f.gestion = j.gestion; f.guardado = 'recién'; f.por = quien; f.llamadas = (f.llamadas || 0) + 1; }
        pintar(); cargar();
      })
      .catch(function(){ err.textContent = 'Sin conexión. Intenta de nuevo.'; btn.disabled = false; btn.textContent = 'Guardar'; });
  }

  function cargar(){
    fetch(BASE + '/llamadas-lista?k=' + encodeURIComponent(clave))
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) { try { localStorage.removeItem('jaye_llamadas_k'); } catch (e) {} bloqueo('El enlace no es válido. Pide uno nuevo.'); return; }
        quien = j.quien;
        /* lo que se está escribiendo en una fila no se pisa con la actualización */
        var nuevas = j.filas || [];
        if (Object.keys(editando).length) {
          var viejas = {}; filas.forEach(function(f){ viejas[f.pedido] = f; });
          var enPantalla = {};
          Array.prototype.forEach.call(tb.querySelectorAll('tr[data-id]'), function(tr){ var id = tr.getAttribute('data-id'); if (editando[id]) enPantalla[id] = { resultado: valor(tr,'resultado'), fecha_horario: valor(tr,'fecha_horario'), direccion_nueva: valor(tr,'direccion_nueva'), nota: valor(tr,'nota') }; });
          nuevas.forEach(function(f){ var e = enPantalla[f.pedido]; if (e) { f.resultado = e.resultado; f.fecha_horario = e.fecha_horario; f.direccion_nueva = e.direccion_nueva; f.nota = e.nota; } });
          if (document.activeElement && tb.contains(document.activeElement)) { filas = nuevas; document.getElementById('estado').textContent = 'Hay cambios sin guardar'; return; }
        }
        filas = nuevas;
        var hora = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Santiago' }) + ' hora Chile';
        document.getElementById('sub').textContent = 'Entraste como ' + (quien === 'Llamadas' ? 'encargada de llamadas' : quien) + ' · se actualiza sola cada minuto';
        document.getElementById('estado').textContent = 'Actualizado ' + hora;
        pintar();
      })
      .catch(function(){ document.getElementById('estado').textContent = 'Sin conexión, reintentando…'; });
  }
  cargar();
  setInterval(cargar, 60000);
})();
</script>
